name: qde_eco_bahor
description: ''
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5


  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Navigation
  go_router: ^17.5.0

  # Localization
  easy_localization: ^3.0.7

  # Network
  dio: ^5.4.1
  connectivity_plus: ^7.3.1

  web: ^1.1.1
  firebase_storage: ^13.5.0
  file_picker: ^12.0.0
  # Local Storage
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.13.0
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.0.2




  # Utils
  intl: 0.20.2

  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9

  injectable_generator: ^3.1.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/translations/en.json
    - assets/translations/ru.json
    - assets/translations/uz.json

